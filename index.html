<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Python — редактор</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: rgba(0, 0, 0, 0.35);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --text-main: #f8f8f2;
            --text-muted: #bdc3c7;
            --accent: #8be9fd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d0d1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background: radial-gradient(circle at 20% 30%, #5e2a8a 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #1a5f7a 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, #3d1f5c 0%, transparent 60%);
            background-size: 200% 200%;
            animation: liquidBg 20s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes liquidBg {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        .glass-container {
            width: 100%;
            max-width: 1000px;
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(1.6);
            -webkit-backdrop-filter: blur(18px) saturate(1.6);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow:
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(255, 255, 255, 0.06),
                0 8px 32px var(--glass-shadow);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .glass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            background: linear-gradient(135deg, #8be9fd, #bd93f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: -12px;
        }

        .editor-wrapper {
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .CodeMirror {
            height: 420px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 14px;
            background: rgba(20, 20, 30, 0.5) !important;
            color: var(--text-main);
            border: none;
        }

        .CodeMirror-gutters {
            background: rgba(255, 255, 255, 0.03) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        .CodeMirror-linenumber { color: var(--text-muted) !important; }

        .CodeMirror-cursor {
            border-left-color: var(--accent) !important;
            border-left-width: 2px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.3),
                0 4px 16px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.4),
                0 6px 20px rgba(0,0,0,0.3);
        }

        .glass-button:active { transform: translateY(0); background: rgba(255, 255, 255, 0.12); }
        .glass-button.primary { background: rgba(139, 233, 253, 0.25); border-color: rgba(139, 233, 253, 0.4); color: #e0f7ff; }
        .glass-button.primary:hover { background: rgba(139, 233, 253, 0.35); }
        .glass-button.secondary { font-weight: 500; font-size: 0.9rem; padding: 10px 18px; }

        .output-panel {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            min-height: 80px;
            max-height: 220px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .output-panel .success { color: #50fa7b; }
        .output-panel .error { color: #ff5555; }
        .output-panel .hint { color: #ffb86c; font-style: italic; }
        .output-panel .error-title { color: #ff79c6; font-weight: 700; }
        .output-panel .error-code {
            background: rgba(255,255,255,0.06);
            padding: 4px 8px;
            border-radius: 6px;
            margin: 4px 0;
            color: #f8f8f2;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .output-panel::-webkit-scrollbar { width: 6px; }
        .output-panel::-webkit-scrollbar-track { background: transparent; }
        .output-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        @media (max-width: 600px) {
            .glass-container { padding: 18px; border-radius: 20px; }
            h1 { font-size: 1.4rem; }
            .CodeMirror { height: 300px; }
            .glass-button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>🐍 <span>Liquid Python</span></h1>
        <p class="subtitle">Пишите код, запускайте его и сразу видьте ошибки — всё в одном стеклянном интерфейсе.</p>

        <div class="editor-wrapper">
            <textarea id="code">
# Добро пожаловать в Liquid Python!
# Попробуйте запустить этот код, а затем специально сломать его.

def greet(name):
    return f"Привет, {name}!"

print(greet("мир"))
            </textarea>
        </div>

        <div class="toolbar">
            <button id="runButton" class="glass-button primary">▶ Выполнить</button>
            <button id="clearButton" class="glass-button secondary">🗑 Очистить вывод</button>
        </div>

        <div id="output" class="output-panel">
            Здесь появится результат выполнения кода...
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

    <script>
        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ РЕДАКТОРА
        // ============================================================
        const editor = CodeMirror.fromTextArea(document.getElementById("code"), {
            mode: "python",
            lineNumbers: true,
            indentUnit: 4,
            theme: "dracula",
            lineWrapping: true,
            autofocus: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-lint-markers"],
            lint: true
        });

        // ============================================================
        // 2. ЗАГРУЗКА PYODIDE
        // ============================================================
        let pyodideReady = false;
        let pyodide = null;
        const outputDiv = document.getElementById("output");

        async function initPyodide() {
            try {
                outputDiv.innerHTML = '<span style="color: var(--text-muted);">Загрузка Python-движка (Pyodide)...</span>';
                pyodide = await loadPyodide();
                pyodideReady = true;
                outputDiv.innerHTML = '<span class="success">✅ Python-движок готов. Можно выполнять код.</span>';
            } catch (err) {
                outputDiv.innerHTML = `<span class="error">❌ Не удалось загрузить Pyodide: ${escapeHtml(err.message)}</span>`;
            }
        }
        initPyodide();

        // ============================================================
        // 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Разбирает «сырой» трейсбек Pyodide и вытаскивает:
         *  - номер строки в пользовательском коде (из File "<exec>", line N)
         *  - саму строку кода пользователя (для наглядности)
         *  - тип ошибки (SyntaxError, NameError, ...)
         *  - сообщение ошибки
         *  - короткую подсказку на русском
         */
        function parsePythonError(errorMessage) {
            const lines = errorMessage.split('\n');

            let userLine = null;      // номер строки в коде пользователя (1-based)
            let userCode = null;      // текст строки, где ошибка
            let errorType = null;     // например "SyntaxError"
            let errorDetail = null;   // текст после двоеточия

            // --- Шаг 1: ищем ИМЕННО нашу строку ---
            // Формат: File "<exec>", line 5, in <module>
            //          или  File "<exec>", line 1
            for (let i = 0; i < lines.length; i++) {
                const match = lines[i].match(/File\s+"<exec>",\s+line\s+(\d+)/);
                if (match) {
                    userLine = parseInt(match[1], 10);
                    // Следующая строка трейсбека обычно содержит сам код пользователя
                    if (i + 1 < lines.length) {
                        const codeLine = lines[i + 1];
                        // Проверяем, что это действительно строка кода, а не продолжение трейсбека
                        if (!/^\s*(File\s+"|Traceback|\^)/.test(codeLine)) {
                            userCode = codeLine.trim();
                        }
                    }
                }
            }

            // --- Шаг 2: ищем финальную строку с типом ошибки ---
            // Обычно это последняя непустая строка вида:
            //   SyntaxError: invalid syntax. Perhaps you forgot a comma?
            for (let i = lines.length - 1; i >= 0; i--) {
                const line = lines[i].trim();
                if (!line) continue;
                if (line.startsWith('File ') || line.startsWith('Traceback')) continue;
                if (/^\^+$/.test(line)) continue;
                const colonIdx = line.indexOf(':');
                if (colonIdx > 0) {
                    errorType = line.substring(0, colonIdx).trim();
                    errorDetail = line.substring(colonIdx + 1).trim();
                    break;
                }
            }

            // --- Шаг 3: короткая подсказка по типу ошибки ---
            let hint = '';
            switch (errorType) {
                case 'SyntaxError':
                    hint = 'Проверьте скобки, кавычки, двоеточия и запятые. Python не смог разобрать строку.';
                    break;
                case 'IndentationError':
                    hint = 'Проверьте отступы. В Python они критически важны: обычно 4 пробела.';
                    break;
                case 'TabError':
                    hint = 'Смешаны табы и пробелы. Используйте что-то одно — лучше пробелы.';
                    break;
                case 'NameError':
                    hint = 'Переменная или функция не определена. Проверьте опечатки и порядок объявлений.';
                    break;
                case 'TypeError':
                    hint = 'Операция не подходит для этого типа данных. Проверьте типы аргументов.';
                    break;
                case 'ValueError':
                    hint = 'Функция получила правильный тип, но неподходящее значение.';
                    break;
                case 'ZeroDivisionError':
                    hint = 'Деление на ноль. Проверьте знаменатель.';
                    break;
                case 'IndexError':
                    hint = 'Индекс за пределами списка. Проверьте длину последовательности.';
                    break;
                case 'KeyError':
                    hint = 'Ключ не найден в словаре. Используйте .get() или проверьте ключ.';
                    break;
                case 'AttributeError':
                    hint = 'У объекта нет такого атрибута или метода. Проверьте название.';
                    break;
                case 'ImportError':
                case 'ModuleNotFoundError':
                    hint = 'Модуль не найден. Возможно, он не поддерживается в Pyodide.';
                    break;
            }

            return { userLine, userCode, errorType, errorDetail, hint };
        }

        // Отображение ошибок в CodeMirror
        function showLintErrors(errors) {
            editor.setOption("lint", {
                getAnnotations: () => errors,
                async: false
            });
        }

        // ============================================================
        // 4. ЗАПУСК КОДА
        // ============================================================
        document.getElementById("runButton").addEventListener("click", async () => {
            if (!pyodideReady) {
                outputDiv.innerHTML = '<span class="hint">⏳ Pyodide ещё загружается. Подождите...</span>';
                return;
            }

            const code = editor.getValue();
            outputDiv.innerHTML = '';
            showLintErrors([]);

            try {
                pyodide.setStdout({
                    batched: (msg) => {
                        outputDiv.innerHTML += `<div style="color: #f8f8f2;">${escapeHtml(msg)}</div>`;
                    }
                });
                pyodide.setStderr({
                    batched: (msg) => {
                        outputDiv.innerHTML += `<div class="error">${escapeHtml(msg)}</div>`;
                    }
                });

                await pyodide.runPythonAsync(code);
                outputDiv.innerHTML += '<div class="success" style="margin-top: 8px;">✅ Выполнено без ошибок.</div>';

            } catch (error) {
                const info = parsePythonError(error.message);

                // --- Красиво выводим ошибку ---
                outputDiv.innerHTML += `<div class="error-title" style="margin-top: 8px;">❌ ${escapeHtml(info.errorType || 'Ошибка выполнения')}</div>`;

                if (info.userLine !== null) {
                    outputDiv.innerHTML += `<div class="error" style="margin-top: 4px;">Строка ${info.userLine}: ${escapeHtml(info.errorDetail || '')}</div>`;
                    if (info.userCode) {
                        outputDiv.innerHTML += `<div class="error-code">${escapeHtml(info.userCode)}</div>`;
                    }
                } else {
                    outputDiv.innerHTML += `<div class="error">${escapeHtml(info.errorDetail || error.message)}</div>`;
                }

                if (info.hint) {
                    outputDiv.innerHTML += `<div class="hint" style="margin-top: 6px;">💡 ${escapeHtml(info.hint)}</div>`;
                }

                // --- Подсветка строки в редакторе ---
                if (info.userLine !== null && info.userLine >= 1) {
                    const zeroBased = info.userLine - 1;
                    // Длина строки: либо реальная длина кода пользователя, либо минимум 1
                    const lineLen = info.userCode ? Math.max(info.userCode.length, 1) : 1;

                    const lintError = {
                        from: CodeMirror.Pos(zeroBased, 0),
                        to: CodeMirror.Pos(zeroBased, lineLen),
                        message: `${info.errorType}: ${info.errorDetail}${info.hint ? '\n\n💡 ' + info.hint : ''}`,
                        severity: 'error'
                    };
                    showLintErrors([lintError]);

                    // Прокручиваем редактор к строке с ошибкой
                    editor.scrollIntoView({ line: zeroBased, ch: 0 }, 100);
                }
            }
        });

        // ============================================================
        // 5. ОЧИСТКА ВЫВОДА
        // ============================================================
        document.getElementById("clearButton").addEventListener("click", () => {
            outputDiv.innerHTML = '<span style="color: var(--text-muted);">Вывод очищен.</span>';
            showLintErrors([]);
        });
    </script>
</body>
</html>
